# Sends the automatic meal notifications (menu reminder, "meal started", "closing soon").
#
# GitHub runs this every 5 minutes and simply calls your website's /api/cron endpoint.
# The server decides whether an alert is due and sends each alert only once.
#
# One-time setup (see docs/NOTIFICATIONS_SETUP.md):
#   GitHub repo -> Settings -> Secrets and variables -> Actions -> "Variables" tab
#     SITE_URL      = https://your-site.vercel.app        (no trailing slash)
#   (optional) "Secrets" tab
#     CRON_SECRET   = any long random text (must match CRON_SECRET in Vercel)
name: Meal alerts

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

concurrency:
  group: meal-alerts
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Call /api/cron
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ]; then
            echo "SITE_URL variable is not set - see docs/NOTIFICATIONS_SETUP.md"; exit 1
          fi
          AUTH=()
          if [ -n "$CRON_SECRET" ]; then AUTH=(-H "Authorization: Bearer $CRON_SECRET"); fi
          curl --fail-with-body --silent --show-error --max-time 60 --retry 2 "${AUTH[@]}" "${SITE_URL%/}/api/cron"
          echo
