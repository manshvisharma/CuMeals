<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>CuMeals - Hostel Mess Menu</title>
    <meta name="description" content="CuMeals - Mobile-First Hostel Mess Menu PWA" />
    
    <!-- Favicon & Standard Icons -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.png" />
    
    <!-- iOS Touch Icon (Single clean high-res 180x180 icon for Apple Home Screen) -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon-precomposed" href="/apple-touch-icon.png" />
    
    <!-- Web App Manifest for Android Chrome PWA -->
    <meta name="theme-color" content="#f2ede3" />
    <script>
      /* Apply the saved theme before first paint (no light/dark flash) */
      (function () {
        try {
          var pref = localStorage.getItem('app_theme_preference') || 'device';
          var dark = pref === 'dark' || (pref === 'device' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute('content', dark ? '#121110' : '#f2ede3');
        } catch (e) {}
      })();
    </script>
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CuMeals" />
    <meta name="application-name" content="CuMeals" />
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
      <style>
      #splash-screen {
        position: fixed; inset: 0; z-index: 99999;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        background-color: #f2ede3; transition: opacity 0.4s ease-out;
      }
      .splash-logo {
        width: 76px; height: 76px; border-radius: 22px;
        background: linear-gradient(to top right, #ff5a3a, #ff8a4c);
        display: flex; align-items: center; justify-content: center; color: #fff;
        box-shadow: 0 10px 30px rgba(255, 90, 58, 0.28);
        animation: splash-pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }
      .splash-title {
        margin-top: 20px; font-size: 1.6rem; font-weight: 700; color: #1c1915; letter-spacing: -0.03em;
        font-family: ui-serif, "New York", "Iowan Old Style", Georgia, serif;
      }
      @keyframes splash-pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.85; transform: scale(0.95); } }
      html.dark #splash-screen { background-color: #121110; }
      html.dark .splash-logo { background: linear-gradient(to top right, #e9dcc6, #f7efe2); color: #d9481c; box-shadow: 0 10px 30px rgba(0,0,0,.5); }
      html.dark .splash-title { color: #f4efe6; }
    </style>
  </head>
  <body class="min-h-screen antialiased">
        <div id="splash-screen">
      <div class="splash-logo">
        <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/>
          <path d="M7 2v20"/>
          <path d="M21 15V2v0a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/>
        </svg>
      </div>
      <div class="splash-title">CuMeals</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
